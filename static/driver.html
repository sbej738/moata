<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#0B6FE8">
  <title>모아타 기사님</title>
  <meta name="description" content="모아타 기사님 앱: 동승 배차 요청 받기, 운행, 요금 입력.">
  <link rel="manifest" href="/static/manifest-driver.webmanifest">
  <link rel="icon" href="/static/icons/icon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="/static/icons/icon-192.png">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="모아타 기사님">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;700&display=swap">
  <link rel="stylesheet" href="/static/vendor/leaflet/leaflet.css">
  <link rel="stylesheet" href="/static/moata.css">
  <style>
    .driver-app { font-size: 16px; }
    .driver-app .title { font-size: 24px; }
    .driver-app .stops .place { font-size: 17px; }
    .summary3 { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; margin-top: 14px; }
    .summary3 .cond { cursor: default; }
    .summary3 .v { font-size: 19px; }
    .pax { display: grid; gap: 8px; margin-top: 12px; }
    .pax .card { display: flex; align-items: center; gap: 12px; padding: 12px 14px; }
    .pax .card.focus { border: 2px solid var(--primary); padding: 11px 13px; background: var(--primary-soft); }
    .next-card .k { font-size: 14px; opacity: .85; }
    .next-card .place { font-size: 26px; font-weight: 700; line-height: 1.25; }
    .preview .between { padding: 8px 0; border-bottom: 1px solid var(--border); }
    .preview .between:last-child { border-bottom: 0; font-weight: 700; }
  </style>
</head>
<body class="mobile-app driver-app">
  <div class="phone" id="root">
    <div class="map" id="map" role="application" aria-label="지도"></div>
    <div class="topbar" id="topbar"></div>
    <div id="float"></div>
    <section class="sheet" id="sheet" aria-live="polite"></section>
  </div>
  <script>window.MOATA_APP = 'driver';</script>
  <script src="/static/vendor/leaflet/leaflet.js"></script>
  <script src="/static/common.js"></script>
  <script src="/static/driver.js"></script>
</body>
</html>
